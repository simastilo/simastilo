main{padding:12px 14px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:2px solid #000;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#FFD500;padding:14px 2px;font-size:11px;text-transform:uppercase;font-family:inherit}
nav button.on{color:#000;background:var(--sel);box-shadow:inset 0 3px 0 #FFD500}
button,.btn{font:inherit}
.hidden{display:none!important}
#btnBack{background:none;border:0;color:#000;font-size:16px;order:-1;padding:4px 0;text-decoration:underline}
input,select,textarea{width:100%;background:#fff;color:#000;border:2px solid #000;border-radius:4px;padding:12px;font:inherit;margin:4px 0 12px;caret-color:#000}
input:focus,select:focus,textarea:focus{outline:3px solid #000;outline-offset:1px}
input::placeholder{color:#7a7a7a}
textarea{min-height:80px}
label{font-size:11px;color:#000;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;background:#000;color:var(--bg);border:2px solid #000;border-radius:4px;padding:14px;text-transform:uppercase;letter-spacing:.05em;text-align:center;margin:6px 0}
.btn.sec{background:transparent;color:#000;border:2px solid #000}
.btn.del{background:none;color:var(--bad);border:2px solid var(--bad)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:8px 0 12px}
.chip{flex:none;background:transparent;border:2px solid #000;color:#000;border-radius:4px;padding:6px 14px;font-family:inherit;font-size:13px;text-transform:uppercase}
.chip.on{background:var(--sel);color:#000;box-shadow:inset 0 -3px 0 #000}
.item{display:flex;gap:12px;background:var(--card);border:2px solid #000;border-left:6px solid #000;border-radius:4px;padding:10px;margin-bottom:10px;align-items:center}
.cover{width:68px;height:68px;border-radius:2px;background:#e8bd00;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px}
.item .t{font-size:16px;line-height:1.2}.item .s{color:var(--mut);font-size:14px}
.badge{font-size:10px;color:#000;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
.photo{width:100%;max-height:300px;object-fit:contain;border-radius:4px;background:#000;margin-bottom:10px}
video{width:100%;border-radius:4px;border:3px solid #000;background:#000;max-height:50vh}
.card{background:var(--card);border:2px solid #000;border-top:6px solid #000;border-radius:4px;padding:14px;margin-bottom:12px}
.big{font-size:40px;color:#000;line-height:1.1}
.bar{height:10px;background:#000;border-radius:0;margin:4px 0 10px}
.mut{color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;color:var(--bg);padding:10px 16px;border-radius:4px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.res{background:var(--card);border:2px solid #000;border-left:6px solid #000;border-radius:4px;padding:10px;margin:6px 0;display:flex;gap:10px;align-items:center}
.star{background:none;border:0;color:var(--mut);font-size:28px;line-height:1;padding:6px 4px;margin-left:auto;font-family:Arial,sans-serif}
.star.on{color:#000}
#cam{position:fixed;inset:0;z-index:50;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);overflow:auto}
.camwrap{width:100%;aspect-ratio:1/1;border:3px solid #000;border-radius:4px;overflow:hidden;background:#000;margin-bottom:12px}
.camwrap video{width:100%;height:100%;object-fit:cover;border:0;border-radius:0;max-height:none}

.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{display:inline-block;font:inherit;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:3px;border:0;line-height:1.1}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.item>div:nth-child(2){min-width:0}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.thumb:first-child{grid-column:span 2}
.thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;border:2px solid #000;border-radius:4px;display:block;background:#000}
.tbtn{display:flex;gap:6px;margin-top:4px}
.tbtn button,.tbtn span{flex:1;font:inherit;font-size:11px;text-transform:uppercase;background:#000;color:#FFD500;border:0;border-radius:4px;padding:8px 4px;text-align:center}
.tbtn span{background:#fff;color:#000;border:2px solid #000}

.alert{background:#000;color:#FFD500;border-radius:4px;padding:12px 14px;margin-bottom:12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.rate{display:flex;gap:6px;margin:4px 0 14px}
.rs{flex:1;background:transparent;border:2px solid #000;border-radius:4px;color:#000;font-size:26px;line-height:1;padding:8px 0;font-family:Arial,sans-serif}
.rs.on{background:#fff}
.sug{max-height:132px;overflow-y:auto}
</style>

<script>'use strict';
/* ---------- DB (IndexedDB) ---------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('collezione', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('items', mode); const s = t.objectStore('items');
    const rq = fn(s); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error);
  });
  return {
    open,
    all: () => tx('readonly', s => s.getAll()),
    put: it => tx('readwrite', s => s.put(it)),
    del: id => tx('readwrite', s => s.delete(id)),
  };
})();

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const FORMATS = { vinyl: ['Vinile', '💿'], cd: ['CD', '📀'], book: ['Libro', '📖'] };
const CONDS = ['', 'M (mint)', 'NM', 'VG+', 'VG', 'G', 'P'];
let items = [];
const TAGPAL = [['#000', '#FFD500'], ['#fff', '#000'], ['#c1121f', '#fff'], ['#1d4ed8', '#fff'], ['#047857', '#fff'], ['#7e22ce', '#fff'], ['#c2410c', '#fff'], ['#0e7490', '#fff']];
const DEFAULT_TAGS = ['Rock', 'Jazz', 'Pop', 'Classica', 'Elettronica', 'Hip Hop', 'Rap', 'Instrumental', 'Mixtape', 'Drum\'n\'Bass', 'Funky', 'Blues', 'Grunge', 'Heavy Metal', 'Crossover', 'Popolare', 'Soul', 'Reggae', 'Punk', 'Disco', 'Cantautori', 'Colonne sonore', 'Italiano', 'Writing', 'Arte', 'Fotografia', 'Graphic Novel', 'Limited Edition', 'Primo pressaggio', 'Autografato', 'Vinile colorato', 'Picture disc', 'Live', 'Raccolta', 'Remix'];
const tagColor = t => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; return TAGPAL[h % TAGPAL.length]; };
const tagEl = (t, el = 'span', attrs = '') => { const [bg, fg] = tagColor(t.toLowerCase()); return `<${el} ${attrs} class="tag" style="background:${bg};color:${fg}">${esc(t)}</${el}>`; };
const allTags = () => [...new Set(items.flatMap(i => i.tags || []).filter(t => t !== 'da-completare'))].sort((x, y) => x.localeCompare(y, 'it'));
let state = { filter: 'all', q: '', sort: 'recent', tag: '', done: '' };
let history_ = [];
let scanner = null;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}
function beep() {
  try { navigator.vibrate && navigator.vibrate(60); const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); setTimeout(() => { o.stop(); a.close(); }, 90); } catch (e) {}
}
function resizeImage(blobOrFile, max = 900, q = 0.72, square = false) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blobOrFile); const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      if (square) {
        const s = Math.min(img.width, img.height), out = Math.min(s, max);
        c.width = c.height = out; c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, out, out);
      } else {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      }
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function fetchJSON(url) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(to); }
}
async function coverToDataURL(url) {
  if (!url) return '';
  try { const r = await fetch(url); if (!r.ok) return ''; const b = await r.blob(); if (b.size < 500) return ''; return await resizeImage(b, 700, 0.75); } catch (e) { return ''; }
}

function squareCamera() {
  return new Promise(async resolve => {
    const ov = document.createElement('div'); ov.id = 'cam';
    ov.innerHTML = '<div class="camwrap"><video playsinline muted autoplay></video></div><p class="mut" style="text-align:center">Inquadra la copertina nel quadrato</p><div class="row"><button class="btn sec" id="camX">Annulla</button><button class="btn" id="camSnap">Scatta</button></div>';
    document.body.appendChild(ov);
    const v = ov.querySelector('video'); let stream;
    const close = val => { if (stream) stream.getTracks().forEach(t => t.stop()); ov.remove(); resolve(val); };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1920 } } });
      v.srcObject = stream; await v.play();
    } catch (e) { return close(null); }
    ov.querySelector('#camX').onclick = () => close(null);
    ov.querySelector('#camSnap').onclick = () => {
      const w = v.videoWidth, h = v.videoHeight, s = Math.min(w, h), out = Math.min(s, 1000);
      const c = document.createElement('canvas'); c.width = c.height = out;
      c.getContext('2d').drawImage(v, (w - s) / 2, (h - s) / 2, s, s, 0, 0, out, out);
      beep(); close(c.toDataURL('image/jpeg', 0.75));
    };
  });
}

/* ---------- online lookups ---------- */
const isBookCode = c => /^97[89]/.test(c) || c.length === 10;
function normMB(r) {
  const fmt = ((r.media && r.media[0] && r.media[0].format) || '').toLowerCase();
  const li = (r['label-info'] || [])[0] || {};
  return {
    format: fmt.includes('vinyl') ? 'vinyl' : fmt.includes('cd') ? 'cd' : '',
    title: r.title || '',
    creator: (r['artist-credit'] || []).map(a => a.name + (a.joinphrase || '')).join('').trim(),
    year: (r.date || '').slice(0, 4),
    publisher: (li.label && li.label.name) || '',
    catalogNo: li['catalog-number'] || '',
    barcode: r.barcode || '',
    coverUrl: r.id ? `https://coverartarchive.org/release/${r.id}/front-500` : '',
  };
}
async function mbSearch(query, limit = 8) {
  const d = await fetchJSON(`https://musicbrainz.org/ws/2/release/?query=${encodeURIComponent(query)}&fmt=json&limit=${limit}`);
  return (d.releases || []).map(normMB);
}
async function bookByIsbn(code) {
  try {
    const d = await fetchJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:${code}`);
    const v = d.items && d.items[0] && d.items[0].volumeInfo;
    if (v) return { format: 'book', title: v.title + (v.subtitle ? ': ' + v.subtitle : ''), creator: (v.authors || []).join(', '), year: (v.publishedDate || '').slice(0, 4), publisher: v.publisher || '', barcode: code, coverUrl: v.imageLinks ? (v.imageLinks.thumbnail || '').replace('http:', 'https:').replace('zoom=1', 'zoom=2') : '' };
  } catch (e) {}
  try {
    const d = await fetchJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${code}&format=json&jscmd=data`);
    const v = d['ISBN:' + code];
    if (v) return { format: 'book', title: v.title + (v.subtitle ? ': ' + v.subtitle : ''), creator: (v.authors || []).map(a => a.name).join(', '), year: ((v.publish_date || '').match(/\d{4}/) || [''])[0], publisher: (v.publishers || []).map(p => p.name).join(', '), barcode: code, coverUrl: v.cover ? v.cover.large || v.cover.medium : '' };
  } catch (e) {}
  return null;
}
async function lookupBarcode(code, hint) {
  if (hint === 'book' || (!hint && isBookCode(code))) { const b = await bookByIsbn(code); if (b) return b; }
  if (hint !== 'book') {
    try { const r = await mbSearch(`barcode:${code}`, 1); if (r[0]) { r[0].barcode = code; if (hint) r[0].format = hint; return r[0]; } } catch (e) {}
  }
  if (!hint) { const b = await bookByIsbn(code); if (b) return b; }
  return null;
}
async function textSearch(q, format) {
  if (format === 'book') {
    const d = await fetchJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8&fields=title,author_name,first_publish_year,publisher,isbn,cover_i`);
    return (d.docs || []).map(x => ({ format: 'book', title: x.title, creator: (x.author_name || []).join(', '), year: x.first_publish_year || '', publisher: (x.publisher || [])[0] || '', barcode: (x.isbn || [])[0] || '', coverUrl: x.cover_i ? `https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg` : '' }));
  }
  const r = await mbSearch(q, 10);
  return r.map(x => ({ ...x, format: format || x.format || 'vinyl' }));
}

/* ---------- router ---------- */
function go(view, params = {}, push = true) {
  stopScanner();
  if (push && state.cur) history_.push(state.cur);
  state.cur = { view, params };
  $('#btnBack').classList.toggle('hidden', !['edit'].includes(view));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.go === view || (view === 'edit' && b.dataset.go === 'add' && !params.id)));
  window.scrollTo(0, 0);

}
document.addEventListener('click', e => {
  const t = e.target.closest('#tabs button'); if (t) { history_ = []; go(t.dataset.go, {}, false); }

/* ---------- SCAN ---------- */
function stopScanner() { if (scanner) { try { scanner.reset(); } catch (e) {} scanner = null; } }
function viewScan(p) {
  $('#title').textContent = 'Scansiona';
  const quickDefault = !p.returnDraft;
  $('#view').innerHTML = `
    <div class="row"><div><label>Formato</label><select id="s_format"><option value="">Rileva da solo</option>${Object.entries(FORMATS).map(([k, x]) => `<option value="${k}">${x[0]}</option>`).join('')}</select></div>
    <div><label>Modalità</label><select id="s_mode"><option value="quick" ${quickDefault ? 'selected' : ''}>Veloce (salva e continua)</option><option value="form" ${quickDefault ? '' : 'selected'}>Apri scheda per controllo</option><option value="wish">Salva in “Da cercare”</option></select></div></div>
    <video id="vid" playsinline muted autoplay></video>
    <p class="mut" id="scanMsg">Inquadra il codice a barre.</p>
    <p class="mut" id="scanCount"></p>
    <label>Oppure scrivilo a mano</label>
    <div class="row"><input id="manual" inputmode="numeric" placeholder="Codice a barre / ISBN"><button class="btn sec" id="manualGo" style="margin-top:4px">Cerca</button></div>`;
  let busy = false, added = 0; const seen = new Set();
  const handle = async code => {
    if (busy) return; busy = true;
    const hint = $('#s_format').value; const mode = $('#s_mode').value;
    beep(); $('#scanMsg').textContent = `Codice ${code}: cerco…`;
    if (items.some(i => i.barcode === code && !!i.wish === (mode === 'wish')) && mode !== 'form') { toast(mode === 'wish' ? 'Già in “Da cercare”' : 'Già in collezione'); $('#scanMsg').textContent = `${code} è già presente.`; setTimeout(() => busy = false, 1800); return; }
    let r = null; try { r = await lookupBarcode(code, hint); } catch (e) {}
    if (mode === 'form') {
      const draft = r ? { ...r, photo: await coverToDataURL(r.coverUrl) } : { barcode: code, format: hint || (isBookCode(code) ? 'book' : 'vinyl') };
      if (!r) toast('Non trovato online: completa a mano');
      return go('edit', { draft }, false);
    }
    const rec = r ? { ...r, photo: await coverToDataURL(r.coverUrl), tags: [] } : { title: `Da completare (${code})`, barcode: code, format: hint || (isBookCode(code) ? 'book' : 'vinyl'), tags: ['da-completare'] };
    if (!r) rec.tags = ['da-completare'];
    delete rec.coverUrl; if (mode === 'wish') rec.wish = true;
    await DB.put({ id: uid(), createdAt: Date.now(), creator: '', year: '', publisher: '', catalogNo: '', condition: '', sleeve: '', price: '', value: '', location: '', notes: '', format: 'vinyl', ...rec });
    await reload(); added++;
    $('#scanMsg').textContent = r ? `Aggiunto: ${r.title}` : `Non trovato: salvato come “da completare”.`;
    $('#scanCount').textContent = `Aggiunti in questa sessione: ${added}`;
    setTimeout(() => busy = false, 1500);
  };
  $('#manualGo').onclick = () => { const c = $('#manual').value.replace(/\D/g, ''); if (c.length >= 8) handle(c); else toast('Codice non valido'); };
  startScanner(handle);
}
function startScanner(onCode) {
  const video = $('#vid'); const Z = window.ZXing; if (!Z) return;
  const hints = new Map(); hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  scanner = new Z.BrowserMultiFormatReader(hints, 300);
  scanner.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } }, video, (res) => {
    if (res) onCode(res.getText());
  }).catch(() => { $('#scanMsg').textContent = 'Fotocamera non disponibile: consenti l’accesso o digita il codice.'; });
}

/* ---------- STATS ---------- */
function viewStats() {
  const own = items.filter(i => !i.wish);
  $('#title').textContent = 'Statistiche';
  const n = f => own.filter(i => i.format === f).length;
  const sum = k => own.reduce((a, i) => a + (parseFloat(String(i[k]).replace(',', '.')) || 0), 0);
  const dec = {}; own.forEach(i => { const y = parseInt(i.year); if (y) { const d = Math.floor(y / 10) * 10; dec[d] = (dec[d] || 0) + 1; } });
  const art = {}; own.forEach(i => { if (i.creator) art[i.creator] = (art[i.creator] || 0) + 1; });
  const topArt = Object.entries(art).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const tg = {}; own.forEach(i => (i.tags || []).forEach(t => { if (t !== 'da-completare') tg[t] = (tg[t] || 0) + 1; }));
  const topTg = Object.entries(tg).sort((a, b) => b[1] - a[1]).slice(0, 12); const maxT = Math.max(1, ...topTg.map(x => x[1]));
  const maxD = Math.max(1, ...Object.values(dec));
  const eur = x => x.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
  $('#view').innerHTML = `
    <div class="card"><div class="big">${own.length}</div><div class="mut">oggetti totali</div><p>★ ${own.filter(i => i.fav).length} preferiti · ✓ ${own.filter(i => i.done).length} già ascoltati o letti</p><p>💿 ${n('vinyl')} vinili · 📀 ${n('cd')} CD · 📖 ${n('book')} libri</p></div>
    <div class="card"><div class="mut">Speso (somma prezzi pagati)</div><div class="big">${eur(sum('price'))}</div><div class="mut">Valore stimato: ${eur(sum('value'))}</div></div>
    <div class="card"><b>Per decennio</b>${Object.keys(dec).sort().map(d => `<div class="mut">${d}s · ${dec[d]}</div><div class="bar" style="width:${dec[d] / maxD * 100}%"></div>`).join('') || '<p class="mut">Nessun dato.</p>'}</div>
    <div class="card"><b>Per tag</b>${topTg.map(([t, c]) => `<div class="mut">${tagEl(t)} ${c}</div><div class="bar" style="width:${c / maxT * 100}%"></div>`).join('') || '<p class="mut">Nessun tag.</p>'}</div>
    <div class="card"><b>Più presenti</b>${topArt.map(([a, c]) => `<div class="mut">${esc(a)} · ${c}</div>`).join('') || '<p class="mut">Nessun dato.</p>'}</div>`;
}

/* ---------- BACKUP ---------- */
function download(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function viewSettings() {
  $('#title').textContent = 'Backup';
  const last = localStorage.getItem('lastBackup');
  $('#view').innerHTML = `
    <div class="card"><b>Backup completo (JSON, con foto)</b><p class="mut">Ultimo backup: ${last ? new Date(+last).toLocaleString('it-IT') : 'mai'}.<br>Salvalo su “File” / iCloud Drive: è la tua assicurazione.</p>
    <button class="btn" id="bJson">Esporta backup</button></div>
    <div class="card"><b>Ripristina da backup</b><p class="mut">Unisce il file alla collezione attuale, senza cancellare nulla.</p>
    <input type="file" id="iJson" accept=".json,application/json" class="hidden"><button class="btn sec" id="bImp">Importa file JSON</button></div>
    <div class="card"><b>Esporta in CSV</b><p class="mut">Per aprirlo in Excel o Numbers (senza foto).</p><button class="btn sec" id="bCsv">Esporta CSV</button></div>
    <p class="mut">Dati salvati solo su questo dispositivo. Spazio persistente: <span id="pers">…</span></p>`;
  $('#bJson').onclick = () => { download(`collezione-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'collezione', version: 1, items }), 'application/json'); localStorage.setItem('lastBackup', Date.now()); };
  $('#bImp').onclick = () => $('#iJson').click();
  $('#iJson').onchange = async e => {
    try {
      const d = JSON.parse(await e.target.files[0].text()); const list = d.items || d; let n = 0;
      for (const it of list) { if (it && it.id && it.title) { await DB.put(it); n++; } }
      await reload(); toast(`Importati ${n} oggetti`); viewSettings();
    } catch (err) { toast('File non valido'); }
  };
  $('#bCsv').onclick = () => {
    const cols = ['format', 'title', 'creator', 'year', 'publisher', 'catalogNo', 'barcode', 'condition', 'sleeve', 'price', 'value', 'location', 'tags', 'notes', 'fav', 'wish', 'rating', 'done'];
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = '\ufeff' + [cols.join(';'), ...items.map(i => cols.map(c => q(c === 'tags' ? (i.tags || []).join(', ') : (c === 'fav' || c === 'wish' || c === 'done') ? (i[c] ? 'sì' : '') : i[c])).join(';'))].join('\n');
    download('collezione.csv', csv, 'text/csv');
  };
  (navigator.storage && navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false)).then(p => { $('#pers').textContent = p ? 'sì' : 'no (fai backup regolari)'; });
}

/* ---------- boot ---------- */
async function reload() { items = (await DB.all()) || []; }
(async () => {
  await DB.open(); await reload();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  
  go('list', {}, false);
})();
</script>
